name: rehabilitation-center

services:

  # ============================================================
  # PostgreSQL 17
  # ============================================================
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}

    volumes:
      - rehab_postgres:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

    security_opt:
      - no-new-privileges:true

    networks:
      - backend

  # ============================================================
  # Spring Boot REST API
  # ============================================================
  backend:
    image: maven:3.9.11-eclipse-temurin-21
    restart: "no"

    depends_on:
      db:
        condition: service_healthy

    working_dir: /workspace

    environment:
      SPRING_BOOT_VERSION: ${SPRING_BOOT_VERSION:-3.5.5}
      MAVEN_OPTS: >-
        -Dfile.encoding=UTF-8
        -Djansi.force=false
        -Djansi.tmpdir=/workspace/target/jansi-tmp
        -Dstyle.color=never
        -XX:MaxRAMPercentage=75

      APP_PORT: ${APP_PORT:-8080}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 is required in .env}
      JWT_ISSUER: ${JWT_ISSUER:-rehab-center}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-14}

      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Chief Medical Officer}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required in .env}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PERMANENT_DELETE_ENABLED: ${PERMANENT_DELETE_ENABLED:-false}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

    volumes:
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
      - backend_target:/workspace/target
      - maven_cache:/root/.m2

    command:
      - /bin/bash
      - -euc
      - |
        mkdir -p /workspace/target/jansi-tmp
        mkdir -p /workspace/target/tmp

        export TMPDIR=/workspace/target/tmp

        echo
        echo "============================================================"
        echo " REHABILITATION CENTER (REHAB_CENTER_COMPOSE_V3)"
        echo "============================================================"
        echo " Web UI:           http://localhost:$${APP_PORT}/"
        echo " Swagger UI:       http://localhost:$${APP_PORT}/swagger-ui.html"
        echo " REST API:         http://localhost:$${APP_PORT}/api"
        echo " OpenAPI JSON:     http://localhost:$${APP_PORT}/v3/api-docs"
        echo " Health:           http://localhost:$${APP_PORT}/actuator/health"
        echo " JavaFX API:       http://localhost:$${APP_PORT}/api"
        echo " Android emulator: http://10.0.2.2:$${APP_PORT}/api"
        echo " PostgreSQL JDBC:  jdbc:postgresql://localhost:$${POSTGRES_PORT}/$${POSTGRES_DB}"
        echo " PostgreSQL user:  $${POSTGRES_USER}"
        echo " Admin login:      $${BOOTSTRAP_ADMIN_EMAIL}"
        echo "============================================================"
        echo
        echo " Spring Boot is starting..."
        echo

        test -f /workspace/pom.xml || {
          echo "ERROR: /workspace/pom.xml not found"
          exit 78
        }

        test -d /workspace/src || {
          echo "ERROR: /workspace/src not found"
          exit 78
        }

        exec mvn \
          -f /workspace/pom.xml \
          -B \
          -ntp \
          -DskipTests \
          org.springframework.boot:spring-boot-maven-plugin:$${SPRING_BOOT_VERSION}:run

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - backend

  # ============================================================
  # Dev Watcher (опционально через --profile dev)
  # ============================================================
  dev-watcher:
    profiles:
      - dev
    image: maven:3.9.11-eclipse-temurin-21
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /workspace
    environment:
      MAVEN_OPTS: >-
        -Dfile.encoding=UTF-8
        -Djansi.force=false
        -Djansi.tmpdir=/workspace/target/jansi-tmp
        -Dstyle.color=never
    volumes:
      - ./pom.xml:/workspace/pom.xml:ro
      - ./src:/workspace/src:ro
      - backend_target:/workspace/target
      - maven_cache:/root/.m2
    command:
      - /bin/bash
      - -euc
      - |
        while true; do
          mvn -f /workspace/pom.xml -B -ntp -DskipTests compile
          sleep 3
        done
    networks:
      - backend

volumes:
  rehab_postgres:
  backend_target:
  maven_cache:

networks:
  backend:
    driver: bridge

