version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: rehabilitation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehabilitation_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerTY89#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rehabilitation_center"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

